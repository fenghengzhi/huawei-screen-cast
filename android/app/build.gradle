plugins { id 'com.android.application' }
def releaseKeystore = providers.environmentVariable('ANDROID_KEYSTORE_PATH').orNull
android {
    namespace 'com.local.huaweicast'
    compileSdk 36
    defaultConfig { applicationId 'com.local.huaweicast'; minSdk 29; targetSdk 35; versionCode 6; versionName '1.5.0' }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    if (releaseKeystore != null) {
        signingConfigs {
            release {
                storeFile file(releaseKeystore)
                storePassword providers.environmentVariable('ANDROID_KEYSTORE_PASSWORD').get()
                keyAlias providers.environmentVariable('ANDROID_KEY_ALIAS').get()
                keyPassword providers.environmentVariable('ANDROID_KEY_PASSWORD').get()
            }
        }
        buildTypes.release.signingConfig = signingConfigs.release
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/licenseAssets').get().asFile)
}
def prepareLicenseAssets = tasks.register('prepareLicenseAssets', Sync) {
    from(rootProject.file('../LICENSE'))
    from(rootProject.file('../third_party'))
    into(layout.buildDirectory.dir('generated/licenseAssets/licenses'))
}
tasks.named('preBuild').configure { dependsOn(prepareLicenseAssets) }
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    testImplementation 'junit:junit:4.13.2'
}
